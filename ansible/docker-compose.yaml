services:
  bank-api:
    image: chidi123/bank-app:3.3.3-10
    ports:
      - 8080:8080
#    env_file:
#      - .env
    depends_on:
      - postgres
    networks:
      - bank-network

  postgres:
    image: postgres:13
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: my-pwd
      POSTGRES_USER: postgres
      POSTGRES_DB: bank
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge

volumes:
  postgres-data:
